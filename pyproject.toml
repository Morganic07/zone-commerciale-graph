[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-satellites"
version = "0.1.0"
description = "Modélisation et simulation d'un réseau de stations spatiales : graphes, flux de personnes, évacuation en cas d'incendie"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "httpx>=0.27",
    "networkx>=3.2",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.setuptools]
packages = ["moteur", "serveur"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# B904 imposerait `raise ... from erreur` dans chaque `except` : une syntaxe de plus
# pour un débutant, sans utilité pour ce projet (CLAUDE.md, « Code débutant »).
ignore = ["B904"]

[tool.mypy]
python_version = "3.11"
strict = true
