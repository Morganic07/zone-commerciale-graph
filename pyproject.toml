[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-satellites"
version = "0.1.0"
description = "Modélisation et simulation d'un réseau de stations spatiales : graphes, flux de personnes, évacuation en cas d'incendie"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "httpx>=0.27",
    "networkx>=3.2",
    "ruff>=0.5",
]

# Le code est rangé par epic (epic2_donnees/moteur, epic3_visionneuse/serveur…).
# Les dossiers n'ont pas de __init__.py : ce sont des paquets « namespace ».
[tool.setuptools.packages.find]
include = ["epic*"]
namespaces = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["epic2_donnees", "epic3_visionneuse", "epic4_algorithmes", "epic5_simulation"]
# Deux epics peuvent avoir des fichiers de test de même nom.
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# B904 imposerait `raise ... from erreur` dans chaque `except` : une syntaxe de plus
# pour un débutant, sans utilité pour ce projet, dont le code vise un niveau lycée.
ignore = ["B904"]

# `demande=Body()` est la manière de FastAPI de lire le JSON envoyé par la page :
# la règle B008, qui interdit un appel de fonction en valeur par défaut, ne s'y applique pas.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Body"]
